[package]
name = "bant"
version = "1.1.2"
description = "Dört ve beş bantlı direnç renk kodu aracı"
license = "UNLICENSED"
authors = ["Bant"]
edition = "2021"

[lib]
name = "bant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
